quarkus.http.port=8080
quarkus.http.test-port=0

planningpoker.gitlab.base-url=https://gitlab.com
planningpoker.gitlab.token=${GITLAB_TOKEN}
planningpoker.gitlab.write-weight=false
planningpoker.session.ttl=12h

quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false

%test.planningpoker.gitlab.token=test-placeholder-gitlab-token
%test.quarkus.log.file.enabled=true
%test.quarkus.log.file.path=target/quarkus-test.log
%test.quarkus.log.file.json.enabled=true

%e2e.planningpoker.gitlab.token=e2e-placeholder-gitlab-token
%e2e.planningpoker.gitlab.base-url=http://localhost:8089
