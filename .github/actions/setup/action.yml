name: Setup
description: >-
  Project-owned toolchain setup for the quality gates: JDK 21 with Maven cache, Node from .nvmrc,
  pnpm with the frontend dependencies and the Playwright browser. The last steps install the
  stack-neutral tools for make sast and make deps.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
        cache-dependency-path: backend/pom.xml

    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: frontend/package.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install frontend dependencies
      shell: bash
      run: pnpm -C frontend install --frozen-lockfile

    - name: Install Playwright browser
      shell: bash
      run: pnpm -C frontend exec playwright install --with-deps chromium

    - name: Install semgrep
      shell: bash
      run: pipx install semgrep

    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: 8.21.2
      run: |
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C /usr/local/bin gitleaks

    - name: Install osv-scanner
      shell: bash
      env:
        OSV_VERSION: v2.0.2
      run: |
        curl -sSL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
        chmod +x /usr/local/bin/osv-scanner
