<mat-form-field [subscriptSizing]="'dynamic'">
  <mat-label i18n="@@timerSetting.label">Timer</mat-label>
  <mat-select
    data-testid="timer-setting"
    [value]="value()"
    [disabled]="sending()"
    (selectionChange)="change($event.value)"
  >
    @for (option of options; track option.seconds) {
      <mat-option [value]="option.seconds" [attr.data-testid]="'timer-option-' + option.seconds">
        {{ option.label }}
      </mat-option>
    }
  </mat-select>
  <mat-hint data-testid="timer-setting-hint" i18n="@@timerSetting.hint"
    >Gilt ab der nächsten Runde.</mat-hint
  >
</mat-form-field>
