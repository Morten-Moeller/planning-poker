<section class="active-issue" data-testid="active-issue">
  <div class="head">
    <span class="iid" data-testid="active-issue-iid">#{{ issue().iid }}</span>
    <h2 data-testid="active-issue-title">{{ issue().title }}</h2>
    <a data-testid="active-issue-link" [href]="issue().webUrl" target="_blank" [rel]="'noopener'"
      ><ng-container i18n="@@activeIssue.openInGitLab">In GitLab öffnen</ng-container>&ngsp;<span
        class="app-symbol"
        aria-hidden="true"
        >↗</span
      ></a
    >
  </div>
  <div class="description-frame" [class.collapsed]="collapsed()">
    <div
      class="description"
      id="active-issue-description"
      data-testid="active-issue-description"
      [innerHTML]="descriptionHtml()"
    ></div>
  </div>
  @if (collapsed()) {
    <button
      type="button"
      class="expand"
      data-testid="active-issue-expand"
      [attr.aria-controls]="'active-issue-description'"
      aria-expanded="false"
      (click)="expand()"
    >
      <span class="app-symbol" aria-hidden="true">▾</span>&ngsp;<ng-container
        i18n="@@activeIssue.expand"
        >Ganze Beschreibung anzeigen</ng-container
      >
    </button>
  } @else if (collapsible()) {
    <button
      type="button"
      class="expand"
      data-testid="active-issue-collapse"
      [attr.aria-controls]="'active-issue-description'"
      aria-expanded="true"
      (click)="collapse()"
    >
      <span class="app-symbol" aria-hidden="true">▴</span>&ngsp;<ng-container
        i18n="@@activeIssue.collapse"
        >Beschreibung einklappen</ng-container
      >
    </button>
  }
</section>
