<mat-toolbar data-testid="toolbar">
  @if (session()) {
    <span class="motif" data-testid="toolbar-motif" aria-hidden="true"></span>
  }
  <span class="title" i18n="@@shell.title">Planning Poker</span>
  @if (session(); as session) {
    <span class="session-id" data-testid="toolbar-session-id">{{ session.sessionId }}</span>
    <span class="spacer"></span>
    @if (myName(); as name) {
      <span class="me" data-testid="toolbar-me">
        {{ name }} ·
        @switch (session.me.role) {
          @case ('SCRUM_MASTER') {
            <ng-container i18n="@@shell.role.SCRUM_MASTER">Scrum Master</ng-container>
          }
          @case ('DEVELOPER') {
            <ng-container i18n="@@shell.role.DEVELOPER">Entwickler</ng-container>
          }
        }
      </span>
    }
  }
  <button
    mat-icon-button
    type="button"
    class="theme-toggle"
    data-testid="theme-toggle"
    [attr.aria-label]="themeLabel()"
    [attr.aria-pressed]="theme.dark()"
    [matTooltip]="themeLabel()"
    (click)="theme.toggle()"
  >
    <span class="theme-symbol" aria-hidden="true">{{ theme.dark() ? '☀️' : '🌙' }}</span>
  </button>
</mat-toolbar>
<app-error-banner />
<main class="content" [class.room]="session() !== null">
  <router-outlet />
</main>
