# Generated by make contracts from backend/src/main (quarkus-smallrye-openapi). Do not edit.
---
openapi: 3.1.0
info:
  title: Planning Poker API
  version: 3.0.0
  description: |
    Commands go over REST under /api and answer without state. The state reaches every participant
    over the WebSocket /ws/sessions/{sessionId} as a full snapshot (SessionView), filtered per
    receiver. Every WebSocket message has the envelope { "type": "...", "payload": { ... } }; the
    message schemas are WebSocketAuth, WebSocketSessionState, WebSocketRoundAllVoted,
    WebSocketError, WebSocketPing and WebSocketPong under components.schemas. The first message of
    the client is auth with the participant token, within 5 seconds; the token is never part of
    the URL. Errors of the REST API are ProblemDetail (RFC 9457) with a stable errorCode.
components:
  schemas:
    WebSocketAuth:
      type: object
      description: "First message of the client, within 5 seconds after the connection\
        \ opened."
      required:
      - type
      - payload
      properties:
        type:
          type: string
          enum:
          - auth
        payload:
          type: object
          required:
          - token
          properties:
            token:
              type: string
              description: Bearer token of the participant from the create or join
                response.
              examples:
              - a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
    WebSocketSessionState:
      type: object
      description: Full snapshot of the session; after a successful auth and after
        every change.
      required:
      - type
      - payload
      properties:
        type:
          type: string
          enum:
          - session.state
        payload:
          $ref: "#/components/schemas/SessionView"
    WebSocketRoundAllVoted:
      type: object
      description: "Every connected developer has voted; only to the scrum master,\
        \ once per round completion."
      required:
      - type
      - payload
      properties:
        type:
          type: string
          enum:
          - round.allVoted
        payload:
          type: object
          required:
          - roundNumber
          properties:
            roundNumber:
              type: integer
              format: int32
              examples:
              - 1
    WebSocketError:
      type: object
      description: Sent when auth failed; the server closes the connection afterwards.
      required:
      - type
      - payload
      properties:
        type:
          type: string
          enum:
          - error
        payload:
          type: object
          required:
          - errorCode
          - detail
          properties:
            errorCode:
              $ref: "#/components/schemas/ErrorCode"
            detail:
              type: string
              examples:
              - Unknown token.
    WebSocketPing:
      type: object
      description: Sent by the client every 30 seconds; the server answers with pong.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - ping
    WebSocketPong:
      type: object
      description: Answer of the server to ping.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - pong
    Card:
      description: Card of the deck in wire format; COFFEE stands for the coffee card.
      type: string
      examples:
      - "5"
      enum:
      - "0"
      - "1"
      - "2"
      - "3"
      - "5"
      - "8"
      - "13"
      - "21"
      - "34"
      - '?'
      - COFFEE
    CardCount:
      type: object
      required:
      - card
      - count
      description: Count of one card in a round.
      properties:
        card:
          $ref: "#/components/schemas/Card"
        count:
          type: integer
          format: int32
          description: How often the card was chosen.
          examples:
          - 2
    ConfirmRequest:
      description: Confirms a card as the final value of the revealed round and writes
        it to GitLab.
      type: object
      required:
      - card
      properties:
        card:
          description: Final card.
          type: string
          $ref: "#/components/schemas/Card"
    CreateSessionRequest:
      description: Creates a session; the caller becomes the scrum master.
      type: object
      required:
      - name
      - gitlabProjectId
      - issueIid
      properties:
        name:
          type: string
          maxLength: 30
          minLength: 1
          description: "Name of the scrum master, 1 to 30 characters after trimming."
          examples:
          - Anna
          pattern: \S
        gitlabProjectId:
          type: string
          description: Id or path of the GitLab project.
          examples:
          - "1234"
          pattern: \S
        issueIid:
          type: integer
          format: int64
          description: Iid of the preselected issue.
          examples:
          - 42
          exclusiveMinimum: 0
    CreateSessionResponse:
      required:
      - sessionId
      - participantId
      - token
      description: Ids and token of the new session and its scrum master.
      type: object
      properties:
        sessionId:
          type: string
          description: "Session id, 8 characters."
          examples:
          - K7P2QX9M
        participantId:
          type: string
          description: Participant id of the scrum master (UUIDv7).
          examples:
          - 01973f5e-2a4b-7c1d-8e2f-3a4b5c6d7e8f
        token:
          type: string
          description: Bearer token of the scrum master.
          examples:
          - d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9
    ErrorCode:
      description: "Stable error code. Clients branch on it, never on the detail text."
      type: string
      enum:
      - VALIDATION_ERROR
      - INVALID_CARD
      - UNAUTHORIZED
      - FORBIDDEN_ROLE
      - PROJECT_NOT_ALLOWED
      - SESSION_NOT_FOUND
      - ISSUE_NOT_FOUND
      - NAME_TAKEN
      - INVALID_STATE
      - LIMIT_REACHED
      - GITLAB_ACCESS_DENIED
      - GITLAB_ERROR
    HealthStatus:
      required:
      - status
      description: Health of the backend.
      type: object
      properties:
        status:
          type: string
          description: UP while the backend answers.
          examples:
          - UP
    HistoryEntryView:
      type: object
      required:
      - issueIid
      - issueTitle
      - roundNumber
      - votes
      - stats
      - finalCard
      - revealedAt
      description: A revealed round in the history of the session. finalCard is the
        confirmed card and null while not confirmed.
      properties:
        issueIid:
          type: integer
          format: int64
          description: Iid of the issue inside the project.
          examples:
          - 42
        issueTitle:
          type: string
          description: Title of the issue at the reveal.
          examples:
          - Login page
        roundNumber:
          type: integer
          format: int32
          description: Round number.
          examples:
          - 1
        votes:
          type: array
          items:
            $ref: "#/components/schemas/VoteView"
          description: Every vote of the round.
        stats:
          $ref: "#/components/schemas/RoundStats"
        finalCard:
          anyOf:
          - $ref: "#/components/schemas/Card"
          - type: "null"
        revealedAt:
          description: "Time of the reveal, RFC 3339 with offset."
          type: string
          examples:
          - 2026-11-16T09:15:30Z
          $ref: "#/components/schemas/OffsetDateTime"
    IssueListResponse:
      required:
      - items
      - nextPage
      description: One page of the issues of the project.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueSummary"
          description: Issues of this page.
        nextPage:
          type:
          - integer
          - "null"
          format: int32
          description: Number of the next page; null on the last page.
          examples:
          - 2
    IssueSummary:
      type: object
      required:
      - iid
      - title
      - webUrl
      - weight
      description: Issue of the project without its description.
      properties:
        iid:
          type: integer
          format: int64
          description: Iid of the issue inside the project.
          examples:
          - 42
        title:
          type: string
          description: Title of the issue.
          examples:
          - Login page
        webUrl:
          type: string
          description: Link to the issue in GitLab.
          examples:
          - https://gitlab.com/group/project/-/issues/42
        weight:
          type:
          - integer
          - "null"
          format: int32
          description: Weight of the issue; null without weight or when GitLab has
            no weight.
          examples:
          - 5
    IssueView:
      type: object
      required:
      - iid
      - title
      - description
      - webUrl
      description: The active GitLab issue.
      properties:
        iid:
          type: integer
          format: int64
          description: Iid of the issue inside the project.
          examples:
          - 42
        title:
          type: string
          description: Title of the issue.
          examples:
          - Login page
        description:
          type: string
          description: Description of the issue as Markdown.
          examples:
          - As a user I want to log in.
        webUrl:
          type: string
          description: Link to the issue in GitLab.
          examples:
          - https://gitlab.com/group/project/-/issues/42
    JoinSessionRequest:
      description: Joins a session as developer.
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 30
          minLength: 1
          description: "Name of the participant, 1 to 30 characters after trimming,\
            \ unique per session."
          examples:
          - Ben
          pattern: \S
    JoinSessionResponse:
      required:
      - participantId
      - token
      description: Id and token of the new participant.
      type: object
      properties:
        participantId:
          type: string
          description: Participant id (UUIDv7).
          examples:
          - 01973f5e-2a4c-7d2e-9f30-4b5c6d7e8f90
        token:
          type: string
          description: Bearer token of the participant.
          examples:
          - a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
    Me:
      type: object
      required:
      - participantId
      - role
      description: Identity of the receiver of the snapshot.
      properties:
        participantId:
          type: string
          description: Participant id (UUIDv7).
          examples:
          - 01973f5e-2a4c-7d2e-9f30-4b5c6d7e8f90
        role:
          $ref: "#/components/schemas/Role"
    OffsetDateTime:
      type: string
      format: date-time
      examples:
      - 2022-03-10T12:15:50-04:00
    ParticipantView:
      type: object
      required:
      - id
      - name
      - role
      - connected
      - hasVoted
      description: A participant as every receiver sees it.
      properties:
        id:
          type: string
          description: Participant id (UUIDv7).
          examples:
          - 01973f5e-2a4b-7c1d-8e2f-3a4b5c6d7e8f
        name:
          type: string
          description: Display name.
          examples:
          - Anna
        role:
          $ref: "#/components/schemas/Role"
        connected:
          type: boolean
          description: Whether the participant is connected over the WebSocket.
        hasVoted:
          type: boolean
          description: Whether the participant has chosen a card in the running round;
            without the value.
    Phase:
      description: "Phase of the session: LOBBY without an active issue, DISCUSSION\
        \ while the team discusses the active issue and the cards are locked, VOTING\
        \ while the cards are open, REVEALED after the reveal."
      type: string
      enum:
      - LOBBY
      - DISCUSSION
      - VOTING
      - REVEALED
    ProblemDetail:
      required:
      - type
      - title
      - status
      - detail
      - errorCode
      description: Error response after RFC 9457. Clients branch on errorCode only.
      type: object
      properties:
        type:
          type: string
          description: URI of the problem type.
          examples:
          - about:blank
        title:
          type: string
          description: HTTP reason phrase.
          examples:
          - Conflict
        status:
          type: integer
          format: int32
          description: HTTP status code.
          examples:
          - 409
        detail:
          type: string
          description: Explanation for people; not stable.
          examples:
          - The round is already revealed.
        errorCode:
          $ref: "#/components/schemas/ErrorCode"
    ProjectListResponse:
      required:
      - items
      - nextPage
      description: One page of the GitLab projects that a session can use.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
          description: Projects of this page.
        nextPage:
          type:
          - integer
          - "null"
          format: int32
          description: Number of the next page; null on the last page.
          examples:
          - 2
    ProjectSummary:
      type: object
      required:
      - id
      - name
      - pathWithNamespace
      - webUrl
      description: "GitLab project with name, path and link."
      properties:
        id:
          type: integer
          format: int64
          description: Numeric id of the project in GitLab.
          examples:
          - 1234
        name:
          type: string
          description: Name of the project.
          examples:
          - Planning Poker
        pathWithNamespace:
          type: string
          description: Path of the project with its group.
          examples:
          - group/planning-poker
        webUrl:
          type: string
          description: Link to the project in GitLab.
          examples:
          - https://gitlab.com/group/planning-poker
    Role:
      description: Role of a participant. The server takes it from the token.
      type: string
      enum:
      - SCRUM_MASTER
      - DEVELOPER
    RoundStats:
      type: object
      required:
      - distribution
      - average
      - mostFrequent
      description: Evaluation of a revealed round.
      properties:
        distribution:
          type: array
          items:
            $ref: "#/components/schemas/CardCount"
          description: "Chosen cards with their count, in deck order."
        average:
          type:
          - number
          - "null"
          format: double
          description: "Average over the number cards, rounded to one decimal; null\
            \ without a number card."
          examples:
          - 4.3
        mostFrequent:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          description: Most frequent cards; several on a tie.
    RoundView:
      type: object
      required:
      - number
      - deadline
      - myVote
      - allVoted
      - confirming
      - votes
      - stats
      description: "The round of the active issue. myVote is the card of the receiver\
        \ and null without a vote or for the scrum master; votes and stats are null\
        \ until the reveal. deadline is the time at which the server reveals the round\
        \ by itself, RFC 3339 with offset, and null when the round started without\
        \ a timer."
      properties:
        number:
          type: integer
          format: int32
          description: "Round number, starting at 1 per issue."
          examples:
          - 1
        deadline:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/OffsetDateTime"
          - type: "null"
        myVote:
          anyOf:
          - $ref: "#/components/schemas/Card"
          - type: "null"
        allVoted:
          type: boolean
          description: Whether every connected developer has voted.
        confirming:
          type: boolean
          description: Whether the result is being written to GitLab.
        votes:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/VoteView"
          description: Every vote with its card; null until the reveal.
        stats:
          anyOf:
          - $ref: "#/components/schemas/RoundStats"
          - type: "null"
    SelectIssueRequest:
      description: Makes an issue the active issue and starts round 1.
      type: object
      required:
      - issueIid
      properties:
        issueIid:
          type: integer
          format: int64
          description: Iid of the issue inside the project.
          examples:
          - 42
          exclusiveMinimum: 0
    SessionView:
      required:
      - sessionId
      - gitlabProjectId
      - phase
      - me
      - participants
      - preselectedIssueIid
      - activeIssue
      - round
      - history
      - timerSeconds
      - serverTime
      description: "Snapshot of the session, filtered for the receiver: hidden cards\
        \ of other participants are missing until the reveal, preselectedIssueIid\
        \ appears only for the scrum master. In phase LOBBY activeIssue and round\
        \ are null. timerSeconds, serverTime and round.deadline are the same for both\
        \ roles."
      type: object
      properties:
        sessionId:
          type: string
          description: "Session id, 8 characters."
          examples:
          - K7P2QX9M
        gitlabProjectId:
          type: string
          description: Id or path of the GitLab project.
          examples:
          - "1234"
        phase:
          $ref: "#/components/schemas/Phase"
        me:
          $ref: "#/components/schemas/Me"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantView"
          description: "Every participant of the session, including disconnected ones."
        preselectedIssueIid:
          type:
          - integer
          - "null"
          format: int64
          description: Iid of the issue given at creation; null for developers.
          examples:
          - 42
        activeIssue:
          anyOf:
          - $ref: "#/components/schemas/IssueView"
          - type: "null"
        round:
          anyOf:
          - $ref: "#/components/schemas/RoundView"
          - type: "null"
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntryView"
          description: "Revealed rounds of the session, newest first."
        timerSeconds:
          type:
          - integer
          - "null"
          format: int32
          description: Timer of the session in seconds for every round that starts
            from now on; null when the timer is off.
          examples:
          - 30
        serverTime:
          description: "Time of the server when the snapshot was built, RFC 3339 with\
            \ offset. Clients compute the remaining time of the round from it."
          type: string
          examples:
          - 2026-11-16T09:15:00Z
          $ref: "#/components/schemas/OffsetDateTime"
    TimerRequest:
      required:
      - seconds
      description: Sets the timer of the session for every round that starts from
        now on; null switches it off. A running round keeps its deadline.
      type: object
      properties:
        seconds:
          type:
          - integer
          - "null"
          format: int32
          description: "Duration of a round in seconds, 5 to 3600; null switches the\
            \ timer off."
          examples:
          - 30
          maximum: 3600
          minimum: 5
    UpdatedPeriod:
      description: "Period of the last change of the issues: WEEK 7 days, MONTH 30\
        \ days, YEAR 365 days, ALL without filter."
      type: string
      enum:
      - WEEK
      - MONTH
      - YEAR
      - ALL
    VoteRequest:
      description: Chooses or changes the hidden card of the caller in the running
        round.
      type: object
      required:
      - card
      properties:
        card:
          description: Chosen card.
          type: string
          $ref: "#/components/schemas/Card"
    VoteView:
      type: object
      required:
      - participantId
      - name
      - card
      description: A revealed vote.
      properties:
        participantId:
          type: string
          description: Participant id (UUIDv7).
          examples:
          - 01973f5e-2a4c-7d2e-9f30-4b5c6d7e8f90
        name:
          type: string
          description: Display name of the participant.
          examples:
          - Ben
        card:
          $ref: "#/components/schemas/Card"
    WeightFilter:
      description: "Filter on the weight of the issues: NONE without weight, ANY with\
        \ weight, ALL without filter."
      type: string
      enum:
      - NONE
      - ANY
      - ALL
  securitySchemes:
    bearerToken:
      type: http
      description: Token of the participant from the create or join response.
      scheme: bearer
tags:
- name: platform
  description: Health of the backend.
- name: projects
  description: GitLab projects and their open issues before a session exists.
- name: sessions
  description: "Sessions, participants and the commands of a round."
paths:
  /api/health:
    get:
      summary: Whether the backend answers.
      operationId: health
      tags:
      - platform
      responses:
        "200":
          description: Backend up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/projects:
    get:
      summary: "Projects for a new session: the project allowlist when set, otherwise\
        \ the projects of the GitLab token."
      operationId: listProjects
      tags:
      - projects
      parameters:
      - description: "Page number, starting at 1."
        name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      - description: Text to search in name and path.
        name: search
        in: query
        schema:
          type: string
      responses:
        "200":
          description: One page of projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "400":
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: "GITLAB_ACCESS_DENIED, GITLAB_ERROR"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/projects/{projectId}/issues:
    get:
      summary: Open issues of a project for a new session.
      operationId: listProjectIssues
      tags:
      - projects
      parameters:
      - description: Id or path of the GitLab project.
        name: projectId
        in: path
        required: true
        schema:
          type: string
      - description: "Page number, starting at 1."
        name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      - description: Text to search in title and description.
        name: search
        in: query
        schema:
          type: string
      responses:
        "200":
          description: One page of open issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueListResponse"
        "400":
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: PROJECT_NOT_ALLOWED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: "GITLAB_ACCESS_DENIED, GITLAB_ERROR"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/sessions:
    post:
      summary: Create a session; the caller becomes the scrum master.
      operationId: createSession
      tags:
      - sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
        required: true
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "400":
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: PROJECT_NOT_ALLOWED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: ISSUE_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: LIMIT_REACHED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: "GITLAB_ACCESS_DENIED, GITLAB_ERROR"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/sessions/{id}:
    get:
      summary: "Snapshot of the session, filtered for the caller."
      operationId: getSession
      tags:
      - sessions
      parameters:
      - description: "Session id, 8 characters."
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
        "401":
          description: UNAUTHORIZED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: SESSION_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerToken: []
  /api/sessions/{id}/active-issue:
    post:
      summary: Make an issue active and start round 1 in DISCUSSION without a deadline;
        scrum master only. A running round is dropped.
      operationId: selectIssue
      tags:
      - sessions
      parameters:
      - description: "Session id, 8 characters."
        name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectIssueRequest"
        required: true
      responses:
