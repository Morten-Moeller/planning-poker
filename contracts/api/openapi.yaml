  /api/sessions/{id}/issues:
    get:
      summary: "Open issues of the project of the session, newest change first; scrum\
        \ master only."
      operationId: listIssues
      tags:
      - sessions
      parameters:
      - description: "Session id, 8 characters."
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: "Page number, starting at 1."
        name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      - description: "Period of the last change: WEEK 7 days, MONTH 30 days, YEAR\
          \ 365 days, ALL without filter."
        name: period
        in: query
        schema:
          allOf:
          - $ref: "#/components/schemas/UpdatedPeriod"
          - default: ALL
      - description: Text to search in title and description.
        name: search
        in: query
        schema:
          type: string
      - description: "Filter on the weight: NONE without weight, ANY with weight,\
          \ ALL without filter. GitLab Free ignores NONE and ANY."
        name: weight
        in: query
        schema:
          allOf:
          - $ref: "#/components/schemas/WeightFilter"
          - default: ALL
      responses:
        "200":
          description: One page of issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueListResponse"
